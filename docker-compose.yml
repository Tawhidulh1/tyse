services:
  elasticsearch:
    image: elasticsearch:9.2.5
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    volumes:
      - ./.searxng-config:/etc/searxng
